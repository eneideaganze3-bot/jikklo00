<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — JIKKLO</title>
  <link rel="canonical" href="https://jikklo.com/contact.html" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <section style="padding-top:32px">
    <div class="container">
      <h2 class="section-title">Contact</h2>
      <p class="section-sub">Une question ? Écris-nous — le message arrive directement dans JIKKLO OS.</p>
      <div class="form-card">
        <div id="error-box"></div>
        <div id="success-box"></div>
        <form id="contact-form">
          <div class="field"><label>Nom</label><input type="text" id="name" required /></div>
          <div class="field"><label>Email (optionnel)</label><input type="email" id="email" /></div>
          <div class="field"><label>Téléphone (optionnel)</label><input type="tel" id="phone" /></div>
          <div class="field"><label>Message</label><textarea id="message" rows="4" required></textarea></div>
          <button type="submit" class="btn btn-navy" style="width:100%">Envoyer</button>
        </form>
      </div>
    </div>
  </section>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script>
    document.getElementById("contact-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("error-box");
      const successBox = document.getElementById("success-box");
      errorBox.innerHTML = ""; successBox.innerHTML = "";
      try {
        await window.jikkloApi.post("/api/public/contact", {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value || undefined,
          phone: document.getElementById("phone").value || undefined,
          message: document.getElementById("message").value,
        });
        successBox.innerHTML = '<div class="success-box">Message envoyé — merci, nous te répondrons rapidement.</div>';
        document.getElementById("contact-form").reset();
      } catch (err) {
        errorBox.innerHTML = `<div class="error-box">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
